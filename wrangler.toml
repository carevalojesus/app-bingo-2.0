name = "bingo-show"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Dominio propio (Cloudflare crea el DNS y el certificado al desplegar). bingo-show.<cuenta>.workers.dev
# sigue funcionando para no romper los enlaces y QR ya compartidos.
workers_dev = true
routes = [{ pattern = "bingo.carevalojesus.com", custom_domain = true }]

# Cloudflare Access para el panel de administración (ver docs/en-linea.md). Vacío = solo con clave.
[vars]
ACCESS_EQUIPO = ""   # p. ej. "carevalojesus" si tu equipo es carevalojesus.cloudflareaccess.com
ACCESS_AUD = ""      # «Application Audience (AUD) Tag» de la aplicación de Access

# Archivos estáticos desde la raíz del repo (lo excluido está en .assetsignore).
# Solo /api/* pasa primero por el Worker; lo demás va directo a los archivos.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[durable_objects.bindings]]
name = "LIMITES"
class_name = "Limitador"

[[durable_objects.bindings]]
name = "REGISTRO"
class_name = "Registro"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

# Límite de salas por IP
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limitador"]

# Registro de códigos Pro y estadísticas (panel de administración)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Registro"]
