name = "bingo-show"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Archivos estáticos desde la raíz del repo (lo excluido está en .assetsignore).
# Solo /api/* pasa primero por el Worker; lo demás va directo a los archivos.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]
